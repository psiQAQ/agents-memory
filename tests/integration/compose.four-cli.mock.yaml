services:
  config-init:
    image: refine-memory-integration-tools:task5
    profiles: ["mock"]
    command: ["config/render-config.mjs", "--out", "/out", "--mode", "mock"]
    environment:
      MEMORY_CORE_GATEWAY_API_KEY: ${MEMORY_CORE_GATEWAY_API_KEY:?set a disposable non-LLM gateway key}
      MEMORY_SPACE_ID: ${MEMORY_SPACE_ID:-default}
    volumes: ["runtime-config:/out"]
    restart: "no"

  memory-core:
    profiles: ["mock"]
    depends_on:
      config-init:
        condition: service_completed_successfully
      mock-llm:
        condition: service_healthy
    environment:
      TDAI_GATEWAY_API_KEY: ${MEMORY_CORE_GATEWAY_API_KEY:?set a disposable non-LLM gateway key}
      TDAI_GATEWAY_CONFIG: /runtime-config/core/tdai-gateway.yaml
    volumes:
      - runtime-config:/runtime-config:ro
  memory-proxy:
    profiles: ["mock"]
    depends_on:
      config-init:
        condition: service_completed_successfully
      memory-core:
        condition: service_healthy
      mock-llm:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/opt/memory-lab/run-proxy.sh"]
    command: []
    environment:
      MEMORY_PROXY_CONFIG: config.yaml
    volumes:
      - runtime-config:/runtime-config:ro
      - ./runtime/run-proxy.sh:/opt/memory-lab/run-proxy.sh:ro
  memory-hub:
    profiles: ["mock"]
    depends_on:
      memory-core:
        condition: service_healthy
      mock-llm:
        condition: service_healthy
    environment:
      REMOTE_INSTANCE_ID: ${MEMORY_SPACE_ID:-default}
      REMOTE_INSTANCE_NAME: ${MEMORY_SPACE_ID:-default}
      REMOTE_INSTANCE_URL: http://memory-core:8420
      REMOTE_INSTANCE_KEY: ${MEMORY_CORE_GATEWAY_API_KEY:?set a disposable non-LLM gateway key}
      REMOTE_INSTANCE_PROXY_URL: http://memory-proxy:8096
      KNOWLEDGE_PUBLIC_BASE_URL: http://memory-hub:8424/v3
      KNOWLEDGE_LLM_PROXY_BASE_URL: ""
      LLM_MODE: custom
      LLM_PROTOCOL: openai
      LLM_PROVIDER: custom
      LLM_BASE_URL: http://mock-llm:8080/openai/v1
      LLM_API_KEY: mock-key
      LLM_MODEL: mock-model
  bootstrap:
    profiles: ["mock"]
    depends_on:
      memory-core:
        condition: service_healthy
    environment:
      MEMORY_CORE_SERVICE_TOKEN_FILE: /runtime-config/gateway.token
    volumes:
      - runtime-config:/runtime-config:ro
  mock-llm:
    image: refine-memory-integration-tools:task5
    profiles: ["mock"]
    command: ["tools/mock-llm.mjs"]
    environment:
      MOCK_HOST: 0.0.0.0
      MOCK_PORT: "8080"
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "node", "tools/healthcheck.mjs", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 2s

  stage1-gate:
    image: refine-memory-integration-tools:task5
    profiles: ["mock"]
    # Bootstrap/runtime-config secrets are root-owned 0600; keep this one-shot
    # oracle root-only and drop every capability instead of widening file modes.
    user: "0:0"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      memory-core:
        condition: service_healthy
      memory-proxy:
        condition: service_healthy
      memory-hub:
        condition: service_healthy
      mock-llm:
        condition: service_healthy
    environment:
      MOCK_BASE_URL: http://mock-llm:8080
      CORE_BASE_URL: http://memory-core:8420
      PROXY_BASE_URL: http://memory-proxy:8096
      PANEL_BASE_URL: http://memory-hub:8125
    command:
      - tools/task5-stage1-runner.mjs
      - --manifest
      - /state/run/run-manifest.json
      - --gateway-token-file
      - /runtime-config/gateway.token
      - --output-dir
      - /evidence
      - --client-evidence-root
      - /client-evidence
      - --scenario
      - ${STAGE1_SCENARIO:-protocol-leak}
    volumes:
      - bootstrap-state:/state:ro
      - runtime-config:/runtime-config:ro
      - claude-evidence:/client-evidence/claude:ro
      - opencode-evidence:/client-evidence/opencode:ro
      - pi-evidence:/client-evidence/pi:ro
      - type: bind
        source: ${EVIDENCE_DIR:-../../.runtime/runs/task5-manual}
        target: /evidence
    restart: "no"
