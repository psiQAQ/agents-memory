services:
  opencode-config:
    image: refine-memory-integration-tools:task5
    profiles: ["opencode"]
    user: "0:0"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    command: ["tools/prepare-agent.mjs", "--agent", "opencode", "--state-dir", "/state/run", "--home-dir", "/agent-home", "--space-id", "${MEMORY_SPACE_ID:-default}"]
    volumes:
      - bootstrap-state:/state:ro
      - opencode-home:/agent-home
    restart: "no"
  opencode-client:
    image: refine-memory-opencode:1.18.16
    profiles: ["opencode"]
    user: "10001:10001"
    init: true
    stdin_open: true
    tty: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      opencode-config:
        condition: service_completed_successfully
      memory-proxy:
        condition: service_healthy
    environment:
      HOME: /home/agent
      MEMORY_SPACE_ID: ${MEMORY_SPACE_ID:-default}
    volumes:
      - opencode-home:/home/agent
      - opencode-workspace:/workspace
    command: ["--version"]
  opencode-headless:
    image: refine-memory-opencode:1.18.16
    profiles: ["opencode"]
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      opencode-config:
        condition: service_completed_successfully
      memory-proxy:
        condition: service_healthy
    environment:
      HOME: /home/agent
      MEMORY_SPACE_ID: ${MEMORY_SPACE_ID:-default}
      MOCK_BASE_URL: http://mock-llm:8080
      STAGE1_CLIENT_SCENARIO: ${STAGE1_CLIENT_SCENARIO:-write}
      STAGE1_OWNER: ${STAGE1_OWNER:-}
    volumes:
      - opencode-home:/home/agent
      - opencode-workspace:/workspace
      - opencode-evidence:/client-evidence
    entrypoint: ["node", "/opt/memory-client/task5-headless-client.mjs"]
    command: ["--client", "opencode", "--run-id", "${RUN_ID:-task5-static}", "--home-dir", "/home/agent", "--bundle-file", "/home/agent/.memory/agent-bundle.json", "--space-id", "${MEMORY_SPACE_ID:-default}", "--template", "/opt/memory-client/settings.template.json", "--evidence-dir", "/client-evidence"]
    restart: "no"
