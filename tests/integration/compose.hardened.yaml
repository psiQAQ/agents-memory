services:
  memory-proxy:
    volumes:
      - runtime-config:/runtime-config:ro
      - proxy-data:/data/tdai-memory-proxy
      - proxy-logs:/app/logs

  loopback-gateway:
    image: refine-memory-integration-tools:local
    build:
      context: .
      dockerfile: images/tools/Dockerfile
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      memory-proxy:
        condition: service_healthy
    environment:
      FORWARD_LISTEN_HOST: 0.0.0.0
      FORWARD_LISTEN_PORT: "8096"
      FORWARD_TARGET_HOST: memory-proxy
      FORWARD_TARGET_PORT: "8096"
    command: ["tools/tcp-forward.mjs"]
    ports:
      - "127.0.0.1:8096:8096"
    networks: [default, loopback-ingress]
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:net').connect(8096, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 2s

volumes:
  proxy-data: {}
  proxy-logs: {}

networks:
  loopback-ingress:
    internal: false
