name: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME}

x-tools-service: &tools-service
  image: refine-memory-integration-tools:task5

services:
  memory-core:
    image: local/refine-memory-core:49c4536-fix1@sha256:fded9d48d76bf71d0652023be0e9aa5553d46c039cc04ace0ec7c1e370f95d44
    expose: ["8420"]
    volumes: ["core-data:/data/tdai-memory"]

  memory-proxy:
    image: local/refine-memory-proxy:9e456a5-auth-fix@sha256:55fedae3f6a3a0a45ac8be45461d8cab23c52f11cc089c1c1e54c7d236de764b
    expose: ["8096"]
    volumes:
      - proxy-data:/data/tdai-memory-proxy
      - proxy-logs:/app/logs

  memory-hub:
    image: local/refine-memory-hub:0a568c3-task2@sha256:a60377245cb4cfff6f5769910ff3a7f4b2fa7b0b64a756a69bf2c552408c44e4
    expose: ["8125", "8424"]
    volumes: ["hub-data:/data/knowledge"]

  bootstrap:
    <<: *tools-service
    depends_on:
      memory-core:
        condition: service_healthy
    environment:
      ACTIVE_CLIENTS: ${ACTIVE_CLIENTS:-claude,opencode,pi}
    command:
      - tools/bootstrap.mjs
      - --core-url
      - http://memory-core:8420
      - --service-id
      - ${MEMORY_SPACE_ID:-default}
      - --run-id
      - ${RUN_ID:?set RUN_ID}
      - --output-dir
      - /state/run
      - --client-manifest
      - /lab/clients/manifest.json
      - --active-clients
      - ${ACTIVE_CLIENTS:-claude,opencode,pi}
    volumes: ["bootstrap-state:/state"]
    restart: "no"

networks:
  default:
    internal: true

volumes:
  runtime-config: {}
  core-data: {}
  proxy-data: {}
  proxy-logs: {}
  hub-data: {}
  bootstrap-state: {}
  claude-home: {}
  claude-workspace: {}
  claude-evidence: {}
  opencode-home: {}
  opencode-workspace: {}
  opencode-evidence: {}
  pi-home: {}
  pi-workspace: {}
  pi-evidence: {}
