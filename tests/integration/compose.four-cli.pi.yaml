services:
  pi-config:
    image: refine-memory-integration-tools:task5
    profiles: ["pi"]
    user: "0:0"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    command: ["tools/prepare-agent.mjs", "--agent", "pi", "--state-dir", "/state/run", "--home-dir", "/agent-home", "--space-id", "${MEMORY_SPACE_ID:-default}"]
    volumes:
      - bootstrap-state:/state:ro
      - pi-home:/agent-home
    restart: "no"
  pi-client:
    image: refine-memory-pi:0.84.1
    profiles: ["pi"]
    user: "10001:10001"
    init: true
    stdin_open: true
    tty: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      pi-config:
        condition: service_completed_successfully
      memory-proxy:
        condition: service_healthy
    environment:
      HOME: /home/agent
      MEMORY_SPACE_ID: ${MEMORY_SPACE_ID:-default}
    volumes:
      - pi-home:/home/agent
      - pi-workspace:/workspace
    command: ["--version"]
  pi-headless:
    image: refine-memory-pi:0.84.1
    profiles: ["pi"]
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      pi-config:
        condition: service_completed_successfully
      memory-proxy:
        condition: service_healthy
    environment:
      HOME: /home/agent
      MEMORY_SPACE_ID: ${MEMORY_SPACE_ID:-default}
      MOCK_BASE_URL: http://mock-llm:8080
      STAGE1_CLIENT_SCENARIO: ${STAGE1_CLIENT_SCENARIO:-write}
      STAGE1_OWNER: ${STAGE1_OWNER:-}
    volumes:
      - pi-home:/home/agent
      - pi-workspace:/workspace
      - pi-evidence:/client-evidence
    entrypoint: ["node", "/opt/memory-client/task5-headless-client.mjs"]
    command: ["--client", "pi", "--run-id", "${RUN_ID:?set RUN_ID}", "--home-dir", "/home/agent", "--bundle-file", "/home/agent/.memory/agent-bundle.json", "--space-id", "${MEMORY_SPACE_ID:-default}", "--template", "/opt/memory-client/settings.template.json", "--evidence-dir", "/client-evidence"]
    restart: "no"
