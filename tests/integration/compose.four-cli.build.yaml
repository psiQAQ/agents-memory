services:
  bootstrap:
    build:
      context: .
      dockerfile: images/tools/Dockerfile

  claude-client:
    image: refine-memory-claude-code:2.1.226
    build:
      context: images/clients/claude
      dockerfile: Dockerfile
      additional_contexts:
        integration: .

  opencode-client:
    build:
      context: images/clients/opencode
      dockerfile: Dockerfile
      additional_contexts:
        integration: .

  pi-client:
    build:
      context: images/clients/pi
      dockerfile: Dockerfile
      additional_contexts:
        integration: .
